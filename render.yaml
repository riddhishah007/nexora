# Render Blueprint for Nexora — permanent deployment
# Connect this repo to Render (https://dashboard.render.com/blueprints) and it will create all services.
# Then set the secrets below in Render dashboard > Environment.

databases:
  - name: nexora-postgres
    plan: starter
    ipAllowList: []
    # Note: Render managed Postgres may not have pgvector pre-installed.
    # If migration CREATE EXTENSION vector fails, switch this DB to a Docker pserv
    # with image pgvector/pgvector:pg16 via infrastructure/docker/postgres/Dockerfile
    # and set DATABASE_URL manually to postgresql://nexora:<password>@nexora-postgres:5432/nexora

services:
  # --- Redis ---
  - type: redis
    name: nexora-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Core API (FastAPI, runs alembic + uvicorn) ---
  - type: web
    name: nexora-core-api
    env: docker
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: ./services/core-api
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # set in dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: SEARCH_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora.vercel.app

  # --- Worker (same image as core-api + worker code) ---
  - type: worker
    name: nexora-worker
    env: docker
    dockerfilePath: ./services/worker/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexora-redis
          type: redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --- Web (Next.js) — prefer Vercel, but also deployable on Render as static ---
  - type: web
    name: nexora-web
    env: node
    plan: starter
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexora-core-api.onrender.com/api/v1
