# Render Blueprint for Nexora — Phase 34 Path A ($0 Free Permanent)
# Frontend: Vercel Hobby ($0). Backend: single Free web service (merged api+worker) + Supabase (pgvector) + Upstash (Redis).
# See docs/DEPLOYMENT.md Option A — Free. No Render Postgres/Redis (they expire/cost); use Supabase/Upstash instead.
# Worker is merged into core-api lifespan (app/main.py) — no separate worker service on Free tier (Free has no `type: worker`).

services:
  # --- Core API (FastAPI + merged worker) — SINGLE Free web service ---
  - type: web
    name: nexora-core-api
    env: docker
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  # Supabase pgvector URI: postgresql://postgres.<ref>:<pass>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      - key: REDIS_URL
        sync: false  # Upstash Redis URL: redis://default:<pass>@<host>:6379 or rediss://
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # set in dashboard: https://console.groq.com
      - key: GEMINI_API_KEY
        sync: false  # optional, for real embeddings text-embedding-004
      - key: SEARCH_API_KEY
        sync: false  # Tavily https://tavily.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora.vercel.app  # update after Vercel deploy to your actual vercel.app URL

# NOTE: No databases / redis / worker / web services here — they would require Starter plan.
# If you want a paid always-on deploy later, switch this service to plan: starter and optionally
# re-add a separate worker + managed postgres/redis. For $0, keep it as above.
