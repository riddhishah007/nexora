name: nexora-phase1

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexora-net

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexora-net

  core-api:
    build:
      context: .
      dockerfile: ./services/core-api/Dockerfile
    container_name: nexora-core-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Phase 34: CMD in Dockerfile already runs alembic upgrade; compose just starts uvicorn (volume mount overrides image for dev)
    volumes:
      - ./services/core-api/app:/app/app
      - ./services/worker/app:/app/worker
      - nexora_file_storage:/app/storage
    networks:
      - nexora-net

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: nexora-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    volumes:
      - nexora_file_storage:/app/storage
    networks:
      - nexora-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexora-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - core-api
    networks:
      - nexora-net

networks:
  nexora-net:
    driver: bridge

volumes:
  nexora_postgres_data:
  nexora_redis_data:
  nexora_file_storage:
